# https://github.com/bitnami/charts/tree/main/bitnami/keycloak/#installing-the-chart
keycloak:
  scrapeConfig:
  enabled: true
  metrics_path: "/probe"
  params:
    module: ["http_2xx"] # List of modules
  static_configs:
    targets:
      - "blackbox.cicd.ddfbackend.com"
  service:
    type: ClusterIP
  ingress:
    ingressClassName: nginx
    enabled: true
    hostname: auth.h4ckm1n.org
  replicaCount: 2
  metrics:
    enabled: true
  proxy: edge # Parce qu'on chiffre la connexion jusqu'à l'ingress nginx
  hostnameVerificationPolicy: "STRICT"
  production: true
  logging:
    level: INFO
