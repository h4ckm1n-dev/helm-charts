argo-cd:
  fullnameOverride: "argo-cd"
  server:
    secretkey: "eW91ci1yYW5kb20tc2VjcmV0"
    resources:
      limits:
        cpu: 4
        ephemeral-storage: 1Gi
        memory: 1Gi
      requests:
        cpu: 20m
        ephemeral-storage: 1Gi
        memory: 100Mi
    ingress:
      enabled: true
      annotations:
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      ingressClassName: nginx
      hostname: argocd.h4ckm1n.org
      tls: true
      selfSigned: true
  redis:
    master:
      persistence:
        enabled: false # no need to persist argo cache
      resources:
        limits:
          cpu: 4
          ephemeral-storage: 1Gi
          memory: 1Gi
        requests:
          cpu: 10m
          ephemeral-storage: 1Gi
          memory: 50Mi
  repoServer:
    resources:
      limits:
        cpu: 4
        ephemeral-storage: 1Gi
        memory: 2Gi
      requests:
        cpu: 10m
        ephemeral-storage: 1Gi
        memory: 100Mi
  controller:
    resources:
      limits:
        cpu: 4
        ephemeral-storage: 1Gi
        memory: 1800Mi
      requests:
        cpu: 150m
        ephemeral-storage: 1Gi
        memory: 1000Mi
