# https://github.com/bitnami/charts/blob/main/bitnami/argo-cd/values.yaml
argo-cd:
  fullnameOverride: "argo-cd"
  applicationSet:
    enabled: true
    replicaCount: 1
    metrics:
      enabled: true
    service:
      type: ClusterIP
      ports:
        webhook: 7000
    networkPolicy:
      enabled: true
      allowExternal: true
      allowExternalEgress: true
    serviceAccount:
      create: true
      name: ""
      automountServiceAccountToken: false
    podSecurityContext:
      enabled: true
      fsGroupChangePolicy: Always
      sysctls: []
      supplementalGroups: []
      fsGroup: 1001
  server:
    resources:
      limits:
        cpu: 4
        ephemeral-storage: 1Gi
        memory: 1Gi
      requests:
        cpu: 20m
        ephemeral-storage: 1Gi
        memory: 100Mi
    ingress:
      enabled: true
      annotations:
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      ingressClassName: nginx
      hostname: argocd.h4ckm1n.org
      tls: true
      selfSigned: true
  redis:
    master:
      persistence:
        enabled: false # no need to persist argo cache
      resources:
        limits:
          cpu: 4
          ephemeral-storage: 1Gi
          memory: 1Gi
        requests:
          cpu: 10m
          ephemeral-storage: 1Gi
          memory: 50Mi
  repoServer:
    resources:
      limits:
        cpu: 4
        ephemeral-storage: 1Gi
        memory: 2Gi
      requests:
        cpu: 10m
        ephemeral-storage: 1Gi
        memory: 100Mi
  controller:
    resources:
      limits:
        cpu: 4
        ephemeral-storage: 1Gi
        memory: 1800Mi
      requests:
        cpu: 150m
        ephemeral-storage: 1Gi
        memory: 1000Mi
