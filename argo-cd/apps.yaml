apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: argo-cd
    name: in-cluster
  project: default
  source:
    path: apps
    repoURL: https://github.com/h4ckm1n-dev/helm-charts.git
    targetRevision: HEAD
