loki:
  fullnameOverride: "loki"
  # Configuration de rétention des logs
  config:
    table_manager:
      retention_deletes_enabled: true
      retention_period: 30d
  # Configuration de stockage persistant
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: standard
  compactor:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi
  distributor:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi
  gateway:
    enabled: false # Désactiver le gateway intégré qui pose problème avec IPv6
    deployment:
      enabled: false # Désactiver complètement le déploiement du gateway
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi
  # Déploiement d'un serveur gateway alternatif
  extraDeploy:
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: loki-gateway-proxy
        labels:
          app: loki-gateway-proxy
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: loki-gateway-proxy
        template:
          metadata:
            labels:
              app: loki-gateway-proxy
          spec:
            containers:
              - name: nginx
                image: nginx:1.27
                ports:
                  - containerPort: 80
                volumeMounts:
                  - name: nginx-config
                    mountPath: /etc/nginx/conf.d/default.conf
                    subPath: nginx.conf
            volumes:
              - name: nginx-config
                configMap:
                  name: loki-gateway-proxy-config
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: loki-gateway-proxy-config
      data:
        nginx.conf: |
          server {
            listen 80;
            
            location = / {
              return 200 "Loki Gateway";
            }
            
            location = /ready {
              return 200 "Ready";
            }
            
            location = /loki/api/v1/push {
              proxy_pass http://grafana-loki-distributor:3100$request_uri;
            }
            
            location ~ /loki/api/.* {
              proxy_pass http://grafana-loki-query-frontend:3100$request_uri;
            }
          }
    - apiVersion: v1
      kind: Service
      metadata:
        name: loki-gateway-proxy
      spec:
        ports:
          - port: 80
            name: http
        selector:
          app: loki-gateway-proxy
  ingester:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi
  promtail:
    config:
      clients:
        - url: http://loki-gateway-proxy.grafana-loki.svc.cluster.local/loki/api/v1/push
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi
    # Configuration pour exclure certains logs
    snippets:
      extraRelabelConfigs:
        - action: drop
          source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          regex: "(prometheus|grafana|loki)"
  querier:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi
  queryFrontend:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi
  queryScheduler:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi
