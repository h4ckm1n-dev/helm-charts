kyverno:
  admissionController:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  cleanupController:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi
  backgroundController:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi
  reportsController:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi

  # Configuration de la haute disponibilité
  tolerations:
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  features:
    logging:
      verbosity: 2 # INFO

  config:
    excludeKyvernoNamespace: true
    resourceFilters:
      - "[Event,*,*]"
      - "[*,kube-system,*]"
      - "[*,kube-public,*]"
      - "[*,kube-node-lease,*]"
      - "[Node,*,*]"
      - "[APIService,*,*]"
      - "[TokenReview,*,*]"
      - "[SubjectAccessReview,*,*]"
      - "[SelfSubjectAccessReview,*,*]"
      - "[Binding,*,*]"
      - "[ReplicaSet,*,*]"
      - "[ReportChangeRequest,*,*]"
      - "[ClusterReportChangeRequest,*,*]"

    # Configuration des webhooks
    webhooks:
      - namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kube-system
                - kyverno
                - cert-manager
                - ingress-nginx

# Configuration des politiques Kyverno
kyverno-policies:
  # Mode de validation des échecs (audit ou enforce)
  validationFailureAction: Audit

  # Standard de sécurité Pod
  podSecurityStandard: restricted

  # Exclusions de politiques spécifiques
  policyExclude:
    adding-capabilities:
      any:
        - resources:
            kinds: [Deployment, DaemonSet, Pod]
            namespaces:
              - kube-system
              - cert-manager
              - ingress-nginx

    host-ports-none:
      any:
        - resources:
            kinds: [Deployment, DaemonSet, Pod]
            namespaces:
              - kube-system
              - ingress-nginx

    require-drop-all:
      any:
        - resources:
            kinds: [StatefulSet, Deployment, DaemonSet, Pod]
            namespaces:
              - kube-system
              - cert-manager

  # Comportement en cas d'échec
  failurePolicy: Ignore

  # Namespaces exclus pour toutes les politiques
  excludedNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
    - cert-manager

  # Politiques additionnelles
  additional:
    kubernetes:
      requirePodRequestsLimits:
        enabled: true
        validation: audit
        excludedNamespaces:
          - kube-system
          - cert-manager
          - ingress-nginx

      requireEmptyDirRequestsLimits:
        enabled: true
        validation: audit

      addNamespaceQuota:
        enabled: true
        excludedNamespaces:
          - default
          - kube-system
          - cert-manager
          - kyverno

    argocd:
      applicationPreventUpdatesProject:
        enabled: false
        validation: Audit
      applicationFieldValidation:
        enabled: false
        validation: Audit
      applicationPreventDefaultProject:
        enabled: false
        validation: Audit
      applicationsetNameMatchesProject:
        enabled: false
        validation: Audit
      appprojectClusterResourceBlacklist:
        enabled: false
        validation: Audit

    aws:
      requireAwsNodeIrsa:
        enabled: true
        validation: Audit

      requireEncryptionAwsLoadBalancers:
        enabled: true
        validation: Audit

    requireDropAllCapabilities:
      enabled: false
      validation: Audit
      excludedNamespaces: [velero]

    disallowLatestTag:
      enabled: true
      validation: Audit

    requireImageChecksum:
      enabled: false
      validation: Audit

    # Mutator
    #resolveImageToDigest:
    #  enabled: false

    cleanup:
      # Garbage collector
      barePods:
        enabled: true

      emptyReplicaSets:
        enabled: true

    nginx-ingress:
      disallowIngressNginxCustomSnippets:
        enabled: true
        validation: Audit

      restrictAnnotations:
        enabled: true
        validation: Enforce

      restrictIngressPath:
        enabled: true
        validation: Enforce

    velero:
      validateCronSchedule:
        enabled: false
        validation: Audit

      # Mutator
      backupAllVolumes:
        enabled: false
