{{- $policy := index .Values "kyverno-policies" "additional" "argocd" "applicationPreventUpdatesProject" }}
{{- if $policy.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: application-prevent-updates-project
  annotations:
    policies.kyverno.io/title: Prevent Updates to Project
    policies.kyverno.io/category: Argo
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.6.2
    policies.kyverno.io/minversion: 1.6.0
    kyverno.io/kubernetes-version: "1.23"
    policies.kyverno.io/subject: Application
    policies.kyverno.io/description: >-
      This policy prevents updates to the project field after an Application is created.
spec:
  validationFailureAction: {{ $policy.validation }}
  failurePolicy: {{ index $.Values "kyverno-policies" "failurePolicy" }}
  background: true
  rules:
    - name: project-updates
      match:
        any:
          - resources:
              kinds:
                - Application
      {{- $glbExdNs := index $.Values "kyverno-policies" "excludedNamespaces" }}
      {{- $eNs := $policy.excludedNamespaces }}
      {{- if or $glbExdNs $eNs  }}
      exclude:
        any:
          - resources:
              kinds:
                - Application
              namespaces:
                {{- if $eNs}}
                {{- $eNs | toYaml | nindent 16 }}
                {{- end }}
                {{- if $glbExdNs}}
                {{- $glbExdNs | toYaml | nindent 16 }}
                {{- end }}
      {{- end }}
      preconditions:
        all:
          - key: "{{`{{ request.operation || 'BACKGROUND' }}`}}"
            operator: Equals
            value: UPDATE
      validate:
        message: "The spec.project cannot be changed once the Application is created."
        deny:
          conditions:
            any:
              - key: "{{`{{ request.object.spec.project }}`}}"
                operator: NotEquals
                value: "{{`{{ request.oldObject.spec.project }}`}}"
{{- end }}