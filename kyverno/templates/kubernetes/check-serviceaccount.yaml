{{- $policy := index .Values "kyverno-policies" "additional" "kubernetes" "checkServiceAccount" }}
{{- if $policy.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: check-sa
  annotations:
    policies.kyverno.io/title: Check ServiceAccount
    policies.kyverno.io/category: Sample
    policies.kyverno.io/subject: Pod,ServiceAccount
    kyverno.io/kyverno-version: 1.6.0
    policies.kyverno.io/minversion: 1.6.0
    kyverno.io/kubernetes-version: "1.21"
    policies.kyverno.io/description: >-
      ServiceAccounts with privileges to create Pods may be able to do so and name
      a ServiceAccount other than the one used to create it. This policy checks the
      Pod, if created by a ServiceAccount, and ensures the `serviceAccountName` field
      matches the actual ServiceAccount.
spec:
  validationFailureAction: {{ $policy.validation }}
  failurePolicy: {{ index $.Values "kyverno-policies" "failurePolicy" }}
  background: false
  rules:
    - name: check-sa
      match:
        any:
        - resources:
            kinds:
            - Pod
      {{- $glbExdNs := index $.Values "kyverno-policies" "excludedNamespaces" }}
      {{- $eNs := $policy.excludedNamespaces }}
      {{- if or $glbExdNs $eNs  }}
      exclude:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                {{- if $eNs}}
                {{- $eNs | toYaml | nindent 16 }}
                {{- end }}
                {{- if $glbExdNs}}
                {{- $glbExdNs | toYaml | nindent 16 }}
                {{- end }}
        {{- end }}
      preconditions:
        all:
        - key: "{{`{{serviceAccountName}}`}}"
          operator: Equals
          value: "*?"
        - key: "{{`{{request.operation}}`}}"
          operator: Equals
          value: CREATE
      validate:
        message: "The ServiceAccount used to create this Pod is confined to using the same account when running the Pod."
        pattern:
          spec:
            serviceAccountName: "{{`{{serviceAccountName}}`}}"
{{- end }}