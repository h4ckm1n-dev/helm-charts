{{- $policy := index .Values "kyverno-policies" "additional" "kubernetes" "requireImageChecksum" }}
{{- if $policy.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-checksum
  annotations:
    policies.kyverno.io/title: Require Images Use Checksums
    policies.kyverno.io/category: Sample
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Use of a SHA checksum when pulling an image is often preferable because tags
      are mutable and can be overwritten. This policy checks to ensure that all images
      use SHA checksums rather than tags.
spec:
  validationFailureAction: {{ $policy.validation }}
  failurePolicy: {{ index $.Values "kyverno-policies" "failurePolicy" }}
  background: true
  rules:
  - name: require-image-checksum
    match:
      any:
      - resources:
          kinds:
          - Pod
    {{- $glbExdNs := index $.Values "kyverno-policies" "excludedNamespaces" }}
    {{- $eNs := $policy.excludedNamespaces }}
    {{- if or $glbExdNs $eNs  }}
    exclude:
      any:
        - resources:
            kinds:
              - Pod
            namespaces:
              {{- if $eNs}}
              {{- $eNs | toYaml | nindent 16 }}
              {{- end }}
              {{- if $glbExdNs}}
              {{- $glbExdNs | toYaml | nindent 16 }}
              {{- end }}
    {{- end }}
    validate:
      message: "Images must use checksums rather than tags."
      pattern:
        spec:
          containers:
          - image: "*@*"
{{- end }}