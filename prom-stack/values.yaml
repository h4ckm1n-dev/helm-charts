# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
kube-prometheus-stack:
  grafana:
    grafana.ini:
      server:
        # The full public facing url you use in browser, used for redirects and emails
        root_url: https://grafana.h4ckm1n.org
    ingress:
      enabled: true
      hosts:
        - grafana.h4ckm1n.org
      annotations:
        kubernetes.io/ingress.class: nginx
  fullnameOverride: kps
  cleanPrometheusOperatorObjectNames: true # Evite d'avoir des noms abracadabrantesques
  defaultRules:
    rules:
      # etcd, kube-scheduler and kube-controller-manager could not be monitored. They are managed outside, by EKS
      etcd: false
      kubeScheduler: false
      kubeControllerManager: false # EKS
  # etcd, kube-scheduler and kube-controller-manager could not be scraped by prom. They are managed outside, by EKS
  kubeControllerManager:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1 # Because we use persistent volume that cannot be mounted by more than one pods to make sure the pods is destroyed first.
    assertNoLeakedSecrets: false # désactivation de cette nouvelle feature en attendant que l'issue https://github.com/grafana/helm-charts/issues/2899 soit corrigée
    grafana.ini:
      auth.generic_oauth:
        name: h4ckm1n.org
        enabled: true
        allow_sign_up: true
        scopes: openid email profile
        auth_url: https://auth.h4ckm1n.org/realms/h4ckm1n.org/protocol/openid-connect/auth
        token_url: https://auth.h4ckm1n.org/realms/h4ckm1n.org/protocol/openid-connect/token
        api_url: https://auth.h4ckm1n.org/realms/h4ckm1n.org/protocol/openid-connect/userinfo
        client_id: grafana-client
        client_secret: iv6RAGdEwGPVsJgRtD7cfAkjrH1UKhbi
        skip_org_role_sync: true
    defaultDashboardsTimezone: Europe/Paris
    sidecar:
      dashboards:
        enabled: true
      datasources:
        enabled: true
      resources:
        limits:
          cpu: 1000m
          memory: 400Mi
          ephemeral-storage: 100Mi
        requests:
          cpu: 20m
          memory: 200Mi
          ephemeral-storage: 100Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-grafana-loki-gateway.loki.svc.cluster.local
        version: 1
        editable: true
        jsonData:
          tlsAuth: false
          tlsAuthWithCACert: false
    dashboards:
      default:
        blackbox-exporter:
          gnetId: 13659
        prom-dashboard:
          gnetId: 15661 # https://grafana.com/grafana/dashboards/15661-1-k8s-for-prometheus-dashboard-20211010/
          datasource: Prometheus
          revision: 1
        node-exporter:
          gnetId: 1860 # https://grafana.com/grafana/dashboards/1860-node-exporter-full/
          datasource: Prometheus
          revision: 33
        nginx:
          datasource: Prometheus
          gnetId: 6927 # https://grafana.com/grafana/dashboards/6927
    downloadDashboards:
      resources:
        limits:
          cpu: 1000m
          memory: 400Mi
          ephemeral-storage: 100Mi
        requests:
          cpu: 20m
          memory: 200Mi
          ephemeral-storage: 100Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: "default"
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            allowUiUpdates: true
            options:
              path: /var/lib/grafana/dashboards/default
    persistence:
      enabled: true
      size: 1Gi
    # request & limits positionnés en fonction de l'usage constaté :
    # https://grafana.cicd.ddfbackend.com/d/85a562078cdf77779eaa1add43ccec1e/kubernetes-compute-resources-namespace-pods?var-datasource=default&var-cluster=&var-namespace=monitoring&orgId=1&refresh=10s
    resources:
      limits:
        cpu: 1000m
        memory: 400Mi
        ephemeral-storage: 100Mi
      requests:
        cpu: 20m
        memory: 200Mi
        ephemeral-storage: 100Mi
    securityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      runAsUser: 1000
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    initChownData:
      enabled: false # Not needed as we set default user see securityContext
  prometheusOperator:
    # request & limits positionnés en fonction de l'usage constaté :
    resources:
      limits:
        cpu: 1000m
        memory: 400Mi
        ephemeral-storage: 100Mi
      requests:
        cpu: 20m
        memory: 200Mi
        ephemeral-storage: 100Mi
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    prometheusConfigReloader:
      resources:
        limits:
          cpu: 1000m
          memory: 400Mi
          ephemeral-storage: 100Mi
        requests:
          cpu: 20m
          memory: 200Mi
          ephemeral-storage: 100Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
  prometheus:
    ingress:
      enabled: true
      hosts:
        - prometheus.h4ckm1n.org
      annotations:
        kubernetes.io/ingress.class: nginx
    resources:
      limits:
        cpu: 1000m
        memory: 400Mi
        ephemeral-storage: 100Mi
      requests:
        cpu: 20m
        memory: 200Mi
        ephemeral-storage: 100Mi
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    prometheusSpec:
      # five config below used to activate services discovery in all namespaces not only in the namespaces where this chart is deployed
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      retention: 365d
      retentionSize: 48GiB
      enforcedNamespaceLabel: "enabled"
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
