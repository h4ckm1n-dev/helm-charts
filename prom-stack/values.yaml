kube-prometheus-stack:
  fullnameOverride: kps
  cleanPrometheusOperatorObjectNames: true
  scrapeConfig:
    enabled: true
    job_name: "blackbox"
    metrics_path: "/probe"
    params:
      module: ["http_2xx"] # List of modules
    static_configs:
      targets:
        - "https://google.com"
    endPoint: "127.0.0.1:9115"
  defaultRules:
    rules:
      etcd: false
      kubeScheduler: false
      kubeControllerManager: false
  kubeControllerManager:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false

  grafana:
    grafana.ini:
      auth.generic_oauth:
        name: h4ckm1n.org
        enabled: true
        allow_sign_up: true
        scopes: openid email profile
        auth_url: https://auth.h4ckm1n.org/realms/h4ckm1n.org/protocol/openid-connect/auth
        token_url: https://auth.h4ckm1n.org/realms/h4ckm1n.org/protocol/openid-connect/token
        api_url: https://auth.h4ckm1n.org/realms/h4ckm1n.org/protocol/openid-connect/userinfo
        client_id: grafana-client
        skip_org_role_sync: true
    defaultDashboardsTimezone: Europe/Paris
    sidecar:
      dashboards:
        enabled: true
      datasources:
        enabled: true
      resources:
        limits:
          cpu: 1000m
          memory: 400Mi
          ephemeral-storage: 100Mi
        requests:
          cpu: 20m
          memory: 200Mi
          ephemeral-storage: 100Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-grafana-loki-gateway.loki.svc.cluster.local
        version: 1
        editable: true
        jsonData:
          tlsAuth: false
          tlsAuthWithCACert: false
    dashboards:
      default:
        blackbox-exporter:
          gnetId: 13659
        prom-dashboard:
          gnetId: 15661
          datasource: Prometheus
          revision: 1
        node-exporter:
          gnetId: 1860
          datasource: Prometheus
          revision: 33
        nginx:
          datasource: Prometheus
          gnetId: 6927
    downloadDashboards:
      resources:
        limits:
          cpu: 1000m
          memory: 400Mi
          ephemeral-storage: 100Mi
        requests:
          cpu: 20m
          memory: 200Mi
          ephemeral-storage: 100Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: "default"
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            allowUiUpdates: true
            options:
              path: /var/lib/grafana/dashboards/default
    persistence:
      enabled: true
      size: 1Gi
    resources:
      limits:
        cpu: 1000m
        memory: 400Mi
        ephemeral-storage: 100Mi
      requests:
        cpu: 20m
        memory: 200Mi
        ephemeral-storage: 100Mi
    securityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      runAsUser: 1000
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    initChownData:
      enabled: false

  prometheusOperator:
    resources:
      limits:
        cpu: 1000m
        memory: 400Mi
        ephemeral-storage: 100Mi
      requests:
        cpu: 20m
        memory: 200Mi
        ephemeral-storage: 100Mi
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    prometheusConfigReloader:
      resources:
        limits:
          cpu: 1000m
          memory: 400Mi
          ephemeral-storage: 100Mi
        requests:
          cpu: 20m
          memory: 200Mi
          ephemeral-storage: 100Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

  prometheus:
    ingress:
      enabled: true
      hosts:
        - prometheus.h4ckm1n.org
      annotations:
        kubernetes.io/ingress.class: nginx
    resources:
      limits:
        cpu: 1000m
        memory: 400Mi
        ephemeral-storage: 100Mi
      requests:
        cpu: 20m
        memory: 200Mi
        ephemeral-storage: 100Mi
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      retention: 365d
      retentionSize: 48GiB
      enforcedNamespaceLabel: "enabled"
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
