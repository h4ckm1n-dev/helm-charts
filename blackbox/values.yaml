prometheus-blackbox-exporter:
  # this is the default configuration provided by Prometheus
  config:
    modules:
      http_2xx:
        prober: http
        http:
          preferred_ip_protocol: 'ip4' # by defaut blackbox use ipv6
      http_post_2xx:
        prober: http
        http:
          method: POST
      tcp_connect:
        prober: tcp
      pop3s_banner:
        prober: tcp
        tcp:
          query_response:
            - expect: '^+OK'
          tls: true
          tls_config:
            insecure_skip_verify: false
      grpc:
        prober: grpc
        grpc:
          tls: true
          preferred_ip_protocol: 'ip4'
      grpc_plain:
        prober: grpc
        grpc:
          tls: false
          service: 'service1'
      ssh_banner:
        prober: tcp
        tcp:
          query_response:
            - expect: '^SSH-2.0-'
            - send: 'SSH-2.0-blackbox-ssh-check'
      irc_banner:
        prober: tcp
        tcp:
          query_response:
            - send: 'NICK prober'
            - send: 'USER prober prober prober :prober'
            - expect: 'PING :([^ ]+)'
              send: 'PONG ${1}'
            - expect: '^:[^ ]+ 001'
      icmp:
        prober: icmp
      icmp_ttl5:
        prober: icmp
        timeout: 5s
        icmp:
          ttl: 5
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
    hosts:
      ## The host property on hosts and tls is passed through helm tpl function.
      ## ref: https://helm.sh/docs/developing_charts/#using-the-tpl-function
      - host: blackbox.cicd.ddfbackend.com
        paths:
          - path: /
            pathType: ImplementationSpecific
  serviceMonitor:
    ## If true, a ServiceMonitor CRD is created for a prometheus operator
    ## https://github.com/coreos/prometheus-operator for blackbox-exporter itself
    ##
    selfMonitor:
      enabled: false
      additionalMetricsRelabels: {}
      additionalRelabeling: []
      labels: {}
      path: /metrics
      scheme: http
      tlsConfig: {}
      interval: 30s
      scrapeTimeout: 30s
      ## Port can be defined by assigning a value for the port key below
      ## port:

    ## If true, a ServiceMonitor CRD is created for a prometheus operator
    ## https://github.com/coreos/prometheus-operator for each target
    ##
    enabled: false
  resources:
    limits:
      cpu: 200m
      memory: 100Mi
    requests:
      cpu: 100m
      memory: 100Mi
