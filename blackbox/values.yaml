# Application settings
app:
  name: blackbox-exporter
  port: 9115

#Ingress settings
ingress:
  enabled: true
  className: 'nginx'
  annotations:
    kubernetes.io/ingress.class: 'nginx'
  host: blackbox.h4ckm1n.org
  path: /
  pathType: Prefix
  tlsEnabled: false
  tlsSecret: '' # Name of the TLS secret (if tlsEnabled is true)
  app:
    name: blackbox-exporter
    port: 9115

# HPA Setting
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

# Deployment settings
replicaCount: 1
image:
  repository: bitnami/blackbox-exporter
strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
resources:
  requests:
    memory: '100Mi'
    cpu: '50m'
  limits:
    memory: '200Mi'
    cpu: '100m'
probes:
  liveness:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
containerSecurityContext:
  runAsUser: 1001
  runAsNonRoot: false
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  procMount: Default
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1001

# Service settings
service:
  type: ClusterIP
  port: 80
  targetPort: 9115
