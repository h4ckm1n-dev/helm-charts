sonarqube:
  extraDeploy:
  existingSecret: "sonarqube" # cf. sonarqube SealedSecret
  minHeapSize: 256m
  maxHeapSize: 512m
  extraProperties:
    - sonar.search.javaAdditionalOpts=-Xms2g -Xmx2g # Elastic suggests to use the same value for Xms and Xmx
  livenessProbe:
    initialDelaySeconds: 600 # 10 minutes
  resources:
    limits:
      cpu: 2
      memory: 5Gi
    requests:
      cpu: 100m
      memory: 2Gi
  service:
    type: ClusterIP # default is LoadBalancer
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: sonar.cicd.ddfbackend.com
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 5m
  plugins:
    install:
      - https://github.com/dependency-check/dependency-check-sonar-plugin/releases/download/4.0.0/sonar-dependency-check-plugin-4.0.0.jar
      - https://github.com/spotbugs/sonar-findbugs/releases/download/4.2.5/sonar-findbugs-plugin-4.2.5.jar
      - https://github.com/sbaudoin/sonar-yaml/releases/download/v1.9.0/sonar-yaml-plugin-1.9.0.jar
      - https://github.com/sonargraph/sonar-sonargraph-integration/releases/download/8.0.0/sonar-sonargraph-integration-8.0.0.jar
  persistence:
    enabled: false
  serviceAccount:
    automountServiceAccountToken: false # a best practice is to avoid mounting serviceAccount if it is not necessary
    create: true
  postgresql:
    enabled: true
    auth:
      existingSecret: sonarqube-postgresql # cf. sonarqube-postgresql-password SealedSecret below
      username: sonar
      database: sonar
    primary:
      persistence:
        enabled: true
        size: 5Gi
