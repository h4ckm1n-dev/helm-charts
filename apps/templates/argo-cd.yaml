apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argo-cd
  namespace: argo-cd
spec:
  generators: []
  template:
    metadata:
      name: argo-cd
      namespace: argo-cd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      destination:
        namespace: argo-cd
        name: https://kubernetes.default.svc
      project: default
      sources:
        - path: argo-cd
          repoURL: https://github.com/h4ckm1n-dev/helm-charts.git
          targetRevision: HEAD
          helm:
            valueFiles:
              - values.yaml
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 2
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s
