apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sealed-secrets
  namespace: argo-cd
spec:
  generators: []
  template:
    metadata:
      name: sealed-secrets
      namespace: argo-cd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      destination:
        namespace: kube-system
        name: https://kubernetes.default.svc
      project: default
      sources:
        - path: sealed-secrets
          repoURL: https://github.com/h4ckm1n-dev/helm-charts.git
          targetRevision: HEAD
          helm:
            valueFiles:
              - values.yaml
      syncPolicy:
        # applicationsSync: create-update # create-update or sync (sync is the normal comportement of argo-cd, create update prevent argo-cd from deleting ressource)
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 2
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s
