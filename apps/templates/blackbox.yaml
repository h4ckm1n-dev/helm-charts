apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: blackbox
  namespace: argo-cd
spec:
  template:
    metadata:
      name: blackbox
      namespace: argo-cd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      destination:
        namespace: backend-ddf
        name: eureden-ddf
      project: default
      sources:
        - path: blackbox
          repoURL: https://github.com/h4ckm1n-dev/helm-charts.git
          targetRevision: HEAD 
          helm:
            releaseName: blackbox
            valueFiles:
              - values.yaml
      syncPolicy:
        autoSync: true
        prune: true
        # applicationsSync: create-update # create-update or sync (sync is the normal comportement of argo-cd, create update prevent argo-cd from deleting ressource)
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 2
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s
