apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grafana-loki
  namespace: argocd
spec:
  generators: []
  template:
    metadata:
      name: grafana-loki
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      destination:
        namespace: loki
        name: https://kubernetes.default.svc
      project: default
      sources:
        - path: grafana-loki
          repoURL: https://github.com/h4ckm1n-dev/helm-charts.git
          targetRevision: HEAD
          helm:
            valueFiles:
              - values.yaml
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 2
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s
